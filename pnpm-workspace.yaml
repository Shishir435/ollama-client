  "@xmldom/xmldom@>=0.9.0 <0.9.12": "0.9.12"
  "@astrojs/markdown-remark@<7.3.0": "7.3.0"
  "astro@<7.2.8": "7.2.10"
  "brace-expansion@>=3.0.0 <5.0.11": "5.0.11"
  "form-data@<4.0.6": ">=4.0.6"
  "immutable@>=5.0.0-beta.1 <5.1.8": "5.1.9"
  "js-yaml@>=4.0.0 <4.3.2": "4.3.2"
  "linkify-it@<5.0.2": "5.0.2"
  "markdown-it@<14.2.0": "14.3.0"
  "nanoid@": "3.3.18"
  "sharp@<0.35.4": "0.35.4"
  "smol-toml@<=1.7.0": "1.7.1"
  "source-map-js@>=1.0.0 <1.2.2": "1.2.2"
