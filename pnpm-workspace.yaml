packages:
  - "."
  - "docs"
  - "packages/*"

minimumReleaseAge: 10080
minimumReleaseAgeStrict: true
minimumReleaseAgeIgnoreMissingTime: false

overrides:
  "@xmldom/xmldom@>=0.7.0 <0.8.15": "0.8.15"
  "@xmldom/xmldom@>=0.9.0 <0.9.12": "0.9.12"
  "@astrojs/markdown-remark@<7.3.0": "7.3.0"
  "astro@<7.2.8": "7.2.10"
  "brace-expansion@>=3.0.0 <5.0.12": "5.0.12"
  "dompurify@<3.4.17": "3.4.17"
  "form-data@<4.0.6": ">=4.0.6"
  "immutable@>=5.0.0-beta.1 <5.1.8": "5.1.9"
  "js-yaml@>=4.0.0 <4.3.2": "4.3.2"
  "linkify-it@<5.0.2": "5.0.2"
  "markdown-it@<14.3.3": "14.3.3"
  # Mammoth uses argparse only in its CLI; v2 retains the deprecated camelCase API.
  # Unlike argparse v1, v2 does not depend on the unpatched sprintf-js package.
  "mammoth>argparse": "2.0.1"
  "mermaid@>=11.0.0-alpha.1 <11.16.1": "11.16.1"
  "katex@>=0.11.0 <0.18.2": "0.18.2"
  "postcss@<8.5.23": "8.5.23"
  "postcss-selector-parser@<7.1.6": "7.1.6"
  "nanoid@": "3.3.18"
  "sharp@<0.35.5": "0.35.5"
  "smol-toml@<1.9.0": "1.9.0"
  "source-map-js@>=1.0.0 <1.2.2": "1.2.2"
  "svgo@>=4.0.0 <4.1.0": "4.1.0"
  "vite@>=8.0.0 <8.1.6": "8.1.6"
  "devalue@>=5.1.0 <=5.9.2": "^5.9.3"
  "http-cache-semantics@<=4.2.0": "^4.2.1"
  "undici@>=8.0.0 <8.10.2": "^8.10.2"
  "zod@>=4.0.0 <4.6.6": "4.6.7"

allowBuilds:
  "@parcel/watcher": true
  esbuild: true
  geckodriver: true
  msw: false
  protobufjs: false
  spawn-sync: true

minimumReleaseAgeExclude:
  - undici@8.10.2
  - brace-expansion@5.0.10 || 5.0.11
  - devalue@5.9.3
  - http-cache-semantics@4.3.0
  - source-map-js@1.2.2
  - markdown-it@14.3.3
