name: Fix OpenAI SSE type safety

on:
  push:
    branches:
      - refactor/0.13.3-cognitive-complexity
    paths:
      - .github/workflows/fix-openai-sse-type-safety.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/0.13.3-cognitive-complexity
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: corepack enable
      - run: pnpm install --frozen-lockfile

      - name: Replace unsafe SSE assertion with runtime validation
        run: |
          python <<'PY'
          from pathlib import Path

          path = Path("src/lib/providers/openai-compatible.ts")
          source = path.read_text()

          anchor = '''interface ToolCallFragment {
            index: number
            id?: string
            type?: string
            function?: { name?: string; arguments?: string }
          }
          '''

          schema = '''interface ToolCallFragment {
            index: number
            id?: string
            type?: string
            function?: { name?: string; arguments?: string }
          }

          const OpenAiSseDataSchema = z
            .object({
              error: z.unknown().optional(),
              choices: z
                .array(
                  z
                    .object({
                      delta: z
                        .object({
                          content: z.unknown().optional(),
                          images: z.unknown().optional(),
                          reasoning: z.string().optional(),
                          reasoning_content: z.string().optional(),
                          thinking: z.string().optional(),
                          thoughts: z.string().optional(),
                          reasoning_details: z.array(z.unknown()).optional(),
                          tool_calls: z.array(z.unknown()).optional()
                        })
                        .passthrough()
                        .optional(),
                      finish_reason: z.string().nullable().optional()
                    })
                    .passthrough()
                )
                .optional(),
              usage: z
                .object({
                  prompt_tokens: z.number().optional(),
                  completion_tokens: z.number().optional()
                })
                .passthrough()
                .optional()
            })
            .passthrough()

          type OpenAiSseData = z.infer<typeof OpenAiSseDataSchema>
          '''

          if anchor not in source:
            raise SystemExit("ToolCallFragment anchor not found")
          source = source.replace(anchor, schema, 1)

          local_type = '''    type TerminalMarker = "finish-reason" | "done" | null
              type OpenAiSseData = {
                error?: unknown
                choices?: Array<{
                  delta?: {
                    content?: unknown
                    images?: unknown
                    reasoning?: string
                    reasoning_content?: string
                    thinking?: string
                    thoughts?: string
                    reasoning_details?: unknown[]
                    tool_calls?: ToolCallFragment[]
                  }
                  finish_reason?: string
                }>
                usage?: { prompt_tokens?: number; completion_tokens?: number }
              }
          '''
          if local_type not in source:
            raise SystemExit("Local OpenAiSseData type block not found")
          source = source.replace(local_type, '    type TerminalMarker = "finish-reason" | "done" | null\n', 1)

          unsafe = '''        const parsed = asRecord(JSON.parse(trimmed.slice(6)))
                  if (!parsed) {
                    logger.warn(
                      "Ignored invalid SSE data event",
                      "OpenAICompatibleProvider"
                    )
                    return null
                  }
                  return parsed as OpenAiSseData
          '''
          safe = '''        const parsed = OpenAiSseDataSchema.safeParse(
                    JSON.parse(trimmed.slice(6))
                  )
                  if (!parsed.success) {
                    logger.warn(
                      "Ignored invalid SSE data event",
                      "OpenAICompatibleProvider",
                      { issues: parsed.error.issues }
                    )
                    return null
                  }
                  return parsed.data
          '''
          if unsafe not in source:
            raise SystemExit("Unsafe SSE assertion block not found")
          source = source.replace(unsafe, safe, 1)

          if "as OpenAiSseData" in source:
            raise SystemExit("Unsafe OpenAiSseData assertion still present")

          path.write_text(source)
          PY

      - run: pnpm exec biome check src/lib/providers/openai-compatible.ts --write --max-diagnostics=100
      - run: pnpm typecheck
      - run: pnpm exec vitest run src/lib/providers --passWithNoTests

      - name: Commit fix and remove temporary workflow
        run: |
          rm .github/workflows/fix-openai-sse-type-safety.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/providers/openai-compatible.ts .github/workflows/fix-openai-sse-type-safety.yml
          git commit -m "refactor: validate OpenAI SSE payloads"
          git push origin HEAD:refactor/0.13.3-cognitive-complexity
