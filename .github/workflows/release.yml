name: Release

# Two ways to cut a release (store submission stays manual either way):
#
# 1. Push a version tag (this repo's convention is bare, no v prefix):
#      git tag 0.12.0 && git push origin 0.12.0
#    A prerelease suffix publishes as a GitHub prerelease automatically:
#      git tag 0.13.0-rc.1 && git push origin 0.13.0-rc.1
#
# 2. Manual: Actions → Release → Run workflow. Enter the version (e.g.
#    0.12.0 or 0.13.0-rc.1) and pick the branch/commit to release from —
#    the workflow creates the tag for you and publishes the release.
#
# Tag the merge commit on main, after the release PR merges — never a branch
# commit beforehand. Squash-merging rewrites the SHA, which leaves the tag
# pointing at a commit that is not in main's history. GitHub then cannot see
# that tag when picking the previous release, so the next release's generated
# notes silently reach further back and re-list the earlier release's PRs.
# This happened to 0.12.3, whose tag had to be moved afterwards.

on:
  push:
    tags:
      - "[0-9]*.[0-9]*.[0-9]*"
      - "v[0-9]*.[0-9]*.[0-9]*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 0.12.0, or 0.13.0-rc.1 for a prerelease)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve release tag
        id: meta
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            TAG="${{ inputs.version }}"
          else
            TAG="$GITHUB_REF_NAME"
          fi
          VERSION="${TAG#v}"
          # Hyphen in the version = semver prerelease (0.13.0-rc.1).
          case "$VERSION" in
            *-*) PRERELEASE="true" ;;
            *)   PRERELEASE="false" ;;
          esac
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"

      - name: Verify version matches package.json
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          TAG_VERSION="${{ steps.meta.outputs.version }}"
          # Prerelease versions only need to match the base version.
          TAG_BASE="${TAG_VERSION%%-*}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ] && [ "$PKG_VERSION" != "$TAG_BASE" ]; then
            echo "Version ${{ steps.meta.outputs.tag }} does not match package.json version $PKG_VERSION"
            exit 1
          fi

      - name: Package Chrome (MV3)
        run: pnpm package

      - name: Package Firefox (MV2)
        run: pnpm package:firefox

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.meta.outputs.tag }}"
          ASSETS=(build/chrome-mv3-prod/*.zip build/firefox-mv2-prod/*.zip)

          # An unmatched glob stays literal in bash and would be handed to gh as
          # a filename, which fails obscurely on create and, worse, uploads a
          # partial asset set on refresh. Fail here with the missing path named.
          for asset in "${ASSETS[@]}"; do
            if [ ! -f "$asset" ]; then
              echo "Expected release asset is missing: $asset"
              exit 1
            fi
          done

          # A tag can arrive here more than once: moving a tag re-triggers this
          # workflow, and `gh release create` fails on an existing release, so a
          # corrected tag would report a red run for work already published.
          #
          # Only a genuine "not found" counts as absence. A network, rate-limit,
          # or auth failure must not be read as "no release", because falling
          # through to `create` would then fail on the existing release and bury
          # the real diagnostic behind a misleading one.
          set +e
          view_error="$(gh release view "$TAG" 2>&1 >/dev/null)"
          view_rc=$?
          set -e
          if [ "$view_rc" -eq 0 ]; then
            release_exists=true
          elif printf '%s' "$view_error" | grep -qiE "release not found|HTTP 404"; then
            release_exists=false
          else
            echo "Could not determine whether release $TAG exists:"
            printf '%s\n' "$view_error"
            exit 1
          fi

          if [ "$release_exists" = true ]; then
            # Add only what is absent; never replace a published asset.
            #
            # A published zip may already have been downloaded, and gh has no
            # atomic multi-asset swap, so a --clobber that failed partway would
            # leave the Chrome and Firefox packages out of step with each other
            # — a worse outcome than the red run this branch exists to avoid.
            # Additive-only keeps the step monotonic: a failed run leaves the
            # release exactly as it was, and re-running finishes the job.
            #
            # Notes are left alone for the same reason: a published body may
            # have been edited by hand, and --generate-notes would discard those
            # edits without saying so.
            published="$(gh release view "$TAG" --json assets -q '.assets[].name')"
            missing=()
            for asset in "${ASSETS[@]}"; do
              if ! printf '%s\n' "$published" | grep -qxF "$(basename "$asset")"; then
                missing+=("$asset")
              fi
            done

            if [ ${#missing[@]} -eq 0 ]; then
              echo "Release $TAG is already published with all its assets. Nothing to do."
              exit 0
            fi

            echo "Release $TAG exists but is missing ${#missing[@]} asset(s):"
            printf '  %s\n' "${missing[@]}"
            gh release upload "$TAG" "${missing[@]}"
            exit 0
          fi

          PRERELEASE_FLAG=""
          if [ "${{ steps.meta.outputs.prerelease }}" = "true" ]; then
            PRERELEASE_FLAG="--prerelease"
          fi
          # On workflow_dispatch the tag doesn't exist yet — --target makes
          # gh create it at the checked-out commit. On tag push, the existing
          # tag is used as-is.
          TARGET_FLAG=""
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            TARGET_FLAG="--target $GITHUB_SHA"
          fi
          gh release create "$TAG" \
            --title "$TAG" \
            --generate-notes \
            $PRERELEASE_FLAG \
            $TARGET_FLAG \
            "${ASSETS[@]}"
