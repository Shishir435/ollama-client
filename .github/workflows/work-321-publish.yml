name: PR 321 publish refactor batch

on:
  push:
    branches:
      - refactor/0.13.3-cognitive-complexity
    paths:
      - .github/workflows/work-321-publish.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: refactor/0.13.3-cognitive-complexity
          fetch-depth: 0
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Load and apply refactors
        run: |
          git fetch origin work/321-complexity-final
          mkdir -p /tmp/321-refactors
          git ls-tree -r --name-only origin/work/321-complexity-final scripts \
            | grep '^scripts/work-321-refactor.*\.mjs$' \
            | sort > /tmp/321-refactors/list.txt
          while IFS= read -r path; do
            file=$(basename "$path")
            git show "origin/work/321-complexity-final:$path" > "/tmp/321-refactors/$file"
          done < /tmp/321-refactors/list.txt
          for script in /tmp/321-refactors/work-321-refactor*.mjs; do node "$script"; done
      - name: Format generated changes
        run: pnpm exec biome check . --write --unsafe || true
      - name: Remove temporary artifacts
        run: |
          rm -f .github/workflows/work-321-publish.yml
          rm -f .github/workflows/complexity-refactor.yml
          rm -f scripts/complexity-refactor-pass.mjs
          rm -f _nonexistent _nonexistent2
      - name: Commit refactor batch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "refactor: apply cognitive complexity cleanup"
          git push origin HEAD:refactor/0.13.3-cognitive-complexity
