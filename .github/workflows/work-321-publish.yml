name: PR 321 publish refactor batch

on:
  push:
    branches:
      - refactor/0.13.3-cognitive-complexity
    paths:
      - .github/workflows/work-321-publish.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: refactor/0.13.3-cognitive-complexity
          fetch-depth: 0
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Load and apply refactors
        run: |
          git fetch origin work/321-complexity-final
          mkdir -p /tmp/321-refactors
          git ls-tree -r --name-only origin/work/321-complexity-final scripts \
            | grep '^scripts/work-321-refactor.*\.mjs$' \
            | sort > /tmp/321-refactors/list.txt
          while IFS= read -r path; do
            file=$(basename "$path")
            git show "origin/work/321-complexity-final:$path" > "/tmp/321-refactors/$file"
          done < /tmp/321-refactors/list.txt
          for script in /tmp/321-refactors/work-321-refactor*.mjs; do node "$script"; done
      - name: Format generated changes
        run: pnpm exec biome check . --write --unsafe || true
      - name: Remove temporary artifacts
        run: |
          rm -f .github/workflows/work-321-publish.yml
          rm -f .github/workflows/complexity-refactor.yml
          rm -f scripts/complexity-refactor-pass.mjs
          rm -f _nonexistent _nonexistent2
      - name: Publish staged tree through GitHub API
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          git add -A
          git diff --cached --check
          python - <<'PY'
          import base64, json, os, subprocess, urllib.request
          token=os.environ['GH_TOKEN']; repo=os.environ['GH_REPO']
          branch='refactor/0.13.3-cognitive-complexity'
          api=f'https://api.github.com/repos/{repo}'
          def req(path, method='GET', data=None):
              body=None if data is None else json.dumps(data).encode()
              r=urllib.request.Request(api+path, data=body, method=method, headers={
                  'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json','Content-Type':'application/json'})
              with urllib.request.urlopen(r) as x: return json.load(x)
          parent=subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip()
          base_tree=subprocess.check_output(['git','rev-parse','HEAD^{tree}'], text=True).strip()
          raw=subprocess.check_output(['git','diff','--cached','--name-only','-z'])
          paths=[p.decode() for p in raw.split(b'\0') if p]
          entries=[]
          for path in paths:
              if os.path.exists(path):
                  with open(path,'rb') as f: content=base64.b64encode(f.read()).decode()
                  sha=req('/git/blobs','POST',{'content':content,'encoding':'base64'})['sha']
                  mode=subprocess.check_output(['git','ls-files','-s','--',path],text=True).split()[0] if subprocess.check_output(['git','ls-files','-s','--',path]) else '100644'
                  entries.append({'path':path,'mode':mode,'type':'blob','sha':sha})
              else:
                  entries.append({'path':path,'mode':'100644','type':'blob','sha':None})
          tree=req('/git/trees','POST',{'base_tree':base_tree,'tree':entries})['sha']
          commit=req('/git/commits','POST',{'message':'refactor: apply cognitive complexity cleanup','tree':tree,'parents':[parent]})['sha']
          req('/git/refs/heads/'+branch,'PATCH',{'sha':commit,'force':False})
          print(commit)
          PY
