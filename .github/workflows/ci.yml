name: CI

on:
  push:
    branches: [main, preview, "release/**"]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  # Lets the browser gates be re-run against any branch on demand — before
  # tagging a release, or after a flake — without opening a pull request.
  # Dispatch only becomes available once this file is on the default branch.
  workflow_dispatch:
  schedule:
    # Broader provider-stream parsing and failure coverage. The focused custom
    # URL and #315 regressions remain blocking on ordinary pull requests.
    - cron: "17 3 * * 1"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Nothing here writes to the repository: it typechecks, builds, and boots a
# packaged extension. Declared explicitly so the token cannot inherit a
# repository or organization default that is wider than that. Artifact
# upload/download use the Actions runtime token, not this one.
permissions:
  contents: read

jobs:
  static-checks:
    name: Static checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Static checks
        run: pnpm check:static

  docs:
    name: Documentation build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # This used to run in pre-push. Keep it required in CI when hooks stop
      # rebuilding the site; provider contracts generate documentation too.
      - name: Build documentation
        run: pnpm docs:build

  test-shards:
    name: Unit tests and coverage (shard ${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run test shard
        run: pnpm test:coverage --shard=${{ matrix.shard }}/3 --reporter=blob
        env:
          VITEST_COVERAGE_SHARD: "true"

      - name: Upload test and coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: vitest-report-${{ matrix.shard }}
          path: .vitest-reports
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: error

  checks:
    # Preserve the stable check name used by branch protection while allowing
    # static analysis, docs and the two test shards to run at the same time.
    name: Typecheck, lint, test
    needs: [static-checks, test-shards, docs]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download test and coverage reports
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: vitest-report-*
          path: .vitest-reports
          merge-multiple: true

      - name: Merge reports and enforce coverage thresholds
        run: pnpm exec vitest --merge-reports=.vitest-reports --coverage --reporter=default

  build:
    name: Build (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        target: [chrome, firefox]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Package
        run: pnpm ${{ matrix.target == 'firefox' && 'package:firefox' || 'package' }}

      - name: Check bundle budgets
        run: pnpm ${{ matrix.target == 'firefox' && 'bundle:check:firefox' || 'bundle:check' }}

      # Release workflow downloads these exact ZIPs from a successful run for
      # its commit. It never rebuilds a second, unverified artifact.
      - name: Upload release package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-package-${{ matrix.target }}
          path: build/${{ matrix.target == 'firefox' && 'firefox-mv2-prod' || 'chrome-mv3-prod' }}/*.zip
          retention-days: 14
          if-no-files-found: error

      - name: Upload the Chrome build for the browser gates
        if: matrix.target == 'chrome'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: chrome-build-prod
          path: build/chrome-mv3-prod
          retention-days: 1
          if-no-files-found: error

  build-benchmark:
    name: Build (chrome benchmark)
    # The benchmark target exposes the lifecycle harness the production build
    # strips, and every browser gate boots it. It used to be a second build
    # step inside `Build (chrome)`, which meant the artifact the whole back
    # half of the run waits on arrived twenty-six seconds later than it had
    # to, for no reason but sharing a runner with a build it does not need.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the benchmark target
        run: pnpm benchmark:build

      - name: Upload the benchmark build for the browser gates
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: chrome-build-benchmark
          path: build/chrome-mv3-benchmark
          retention-days: 1
          if-no-files-found: error

  olc-package:
    name: olc distribution (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build registry-free bundle
        run: pnpm proxy:bundle

      - name: Package portable archives
        if: runner.os == 'Linux'
        run: |
          mkdir -p release/olc/bin release/olc/dist
          cp packages/olc/bin/olc packages/olc/bin/olc.cmd release/olc/bin/
          cp packages/olc/dist/olc.mjs release/olc/dist/
          cp -R packages/olc/dist/backends release/olc/dist/
          cp packages/olc/README.md release/olc/
          chmod +x release/olc/bin/olc release/olc/dist/olc.mjs
          tar -C release -czf olc.tar.gz olc
          (cd release && zip -qr ../olc.zip olc)
          sha256sum olc.tar.gz > olc.tar.gz.sha256
          sha256sum olc.zip > olc.zip.sha256
          # The install wrappers ship as release assets too, so a user can pin
          # one to a tag and verify it before granting it their own privileges.
          # Hashing the checked-out copy keeps them on the same verified-CI-run
          # provenance path as the archives they install.
          cp docs/public/olc.sh docs/public/olc.ps1 .
          sha256sum olc.sh > olc.sh.sha256
          sha256sum olc.ps1 > olc.ps1.sha256
          node packages/olc/dist/olc.mjs --help

      - name: Verify Windows launcher and installer syntax
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & .\packages\olc\bin\olc.cmd --help
          [scriptblock]::Create((Get-Content -Raw docs\public\olc.ps1)) | Out-Null

      - name: Upload olc release package
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-package-olc
          path: |
            olc.tar.gz
            olc.tar.gz.sha256
            olc.zip
            olc.zip.sha256
            olc.sh
            olc.sh.sha256
            olc.ps1
            olc.ps1.sha256
          retention-days: 14
          if-no-files-found: error

  persistence-migration:
    name: Persistence migration gates (chrome)
    # The evidence gate for retiring the legacy sql.js backend: a packaged
    # Chromium profile migrates a real legacy blob, is interrupted mid-flight,
    # and is verified table by table. The report is uploaded on success too —
    # a gate whose evidence only exists on a laptop cannot be reviewed.
    # Gated on `static-checks` rather than `checks` for the reason spelled
    # out on the browser gates below: the browser work waits on the verdict
    # that a branch compiles and lints, not on coverage being merged.
    needs: [static-checks, build-benchmark]
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.draft == false &&
       !contains(github.event.pull_request.labels.*.name, 'skip-e2e'))
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download the benchmark build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: chrome-build-benchmark
          path: build/chrome-mv3-benchmark

      - name: Resolve Playwright version
        id: playwright
        run: |
          echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      # The runner image ships Google's Chrome apt source, and Playwright's
      # dependency install runs `apt-get update` across every source. That
      # mirror serves a stale index often enough to fail the whole gate for a
      # repository nothing here reads, so it is dropped first.
      - name: Install Chromium
        # `--with-deps` is apt, which is most of this step even when the
        # browser cache hit and nothing is downloaded. The runner image
        # already ships Chromium's shared libraries, so only a cold cache
        # needs them. A launch failing on a missing shared object means this
        # branch was wrong: run `--with-deps` unconditionally again.
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome*.list \
            /etc/apt/sources.list.d/google*.list
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" = "true" ]; then
            pnpm exec playwright install chromium
          else
            pnpm exec playwright install --with-deps chromium
          fi

      # Under xvfb so the runner's own headless→headful retry has a display to
      # fall back to when extension-id resolution fails headless.
      - name: Verify OPFS migration
        run: xvfb-run --auto-servernum pnpm verify:opfs-migration

      - name: Upload migration evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: persistence-migration-evidence-chrome
          path: artifacts/persistence-benchmark
          retention-days: 30
          if-no-files-found: error

  persistence-migration-firefox:
    name: Persistence migration gates (firefox)
    # Production-path Firefox MV2 owner smoke plus concurrent-write, migration,
    # restart, and export evidence. This is a release gate, not an opt-in soak:
    # persistent-background owner is a different topology from Chromium.
    # Gated on `static-checks` rather than `checks` for the reason spelled
    # out on the browser gates below: the browser work waits on the verdict
    # that a branch compiles and lints, not on coverage being merged.
    needs: [static-checks]
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.draft == false &&
       !contains(github.event.pull_request.labels.*.name, 'skip-e2e'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Downloaded from Mozilla rather than installed through a third-party
      # action or the snap package: the snap build cannot use an arbitrary
      # profile directory, which the restart scenario depends on.
      - name: Install Firefox
        run: |
          curl -fsSL -o /tmp/firefox.tar.xz \
            "https://download.mozilla.org/?product=firefox-latest-ssl&os=linux64&lang=en-US"
          mkdir -p "$HOME/firefox"
          tar -xJf /tmp/firefox.tar.xz -C "$HOME"
          "$HOME/firefox/firefox" --version

      - name: Build the Firefox benchmark target
        run: pnpm benchmark:build:firefox

      - name: Verify OPFS migration
        run: |
          export FIREFOX_BIN="$HOME/firefox/firefox"
          xvfb-run --auto-servernum pnpm verify:firefox-opfs-migration

      - name: Upload migration evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: persistence-migration-evidence-firefox
          path: artifacts/persistence-benchmark
          retention-days: 30
          if-no-files-found: error

  e2e:
    name: Critical browser gates (shard ${{ matrix.shard }}/3)
    # Runs on the exact bytes `build` packaged rather than a rebuild, so what
    # boots here is what would ship.
    #
    # Gated on `static-checks` rather than `checks`. The intent was that a
    # branch failing typecheck or lint has nothing to prove in a browser, and
    # that verdict belongs to `static-checks`, which lands ~70s in. Waiting for
    # `checks` meant also waiting for both unit shards and the docs build so
    # coverage could be merged — about ninety seconds of the whole back half of
    # the run spent on an answer this job never reads.
    #
    # Sharded because the suite is 42 tests, and the fixture already gives
    # every test its own mkdtemp profile and persistent context, so the
    # isolation separate runners need is already paid for. Three shards rather
    # than two because `--shard` balances test counts and not seconds: the
    # agent scenarios cost ~6.7s each against ~2.9s for everything else, so two
    # shards left a 45s gap between them that a third closes.
    needs: [static-checks, build, build-benchmark]
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.draft == false &&
       !contains(github.event.pull_request.labels.*.name, 'skip-e2e'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      # A failing shard must not cancel its sibling. Which half of the suite
      # broke is the first thing worth knowing, and a cancelled shard reports
      # nothing at all.
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download the Chrome build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: chrome-build-prod
          path: build/chrome-mv3-prod

      - name: Download the benchmark build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: chrome-build-benchmark
          path: build/chrome-mv3-benchmark

      - name: Resolve Playwright version
        id: playwright
        run: |
          echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      # Keyed on the Playwright version, so a browser download happens only when
      # that dependency actually changes.
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      # The runner image ships Google's Chrome apt source, and Playwright's
      # dependency install runs `apt-get update` across every source. That
      # mirror serves a stale index often enough to fail the whole gate for a
      # repository nothing here reads, so it is dropped first.
      - name: Install Chromium
        # `--with-deps` is apt, which is most of this step even when the
        # browser cache hit and nothing is downloaded. The runner image
        # already ships Chromium's shared libraries, so only a cold cache
        # needs them. A launch failing on a missing shared object means this
        # branch was wrong: run `--with-deps` unconditionally again.
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome*.list \
            /etc/apt/sources.list.d/google*.list
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" = "true" ]; then
            pnpm exec playwright install chromium
          else
            pnpm exec playwright install --with-deps chromium
          fi

      # `--max-failures` bounds a branch that is simply broken rather than
      # flaky. Across ninety-nine runs this step's median was ~225s and its p95
      # ~983s; every run in that tail was an agent branch where specs hung to
      # the 60s timeout and the CI retry ran each of them twice. Five failures
      # is already the answer.
      - name: Run critical browser gates
        run: pnpm e2e:chromium:critical --shard=${{ matrix.shard }}/3 --max-failures=5

      # Not sharded: together they are seven seconds, and a job of their own
      # would pay half a minute of setup to save none.
      - name: Verify isolated service-worker turn recovery
        if: matrix.shard == 1
        run: E2E_HEADFUL=1 xvfb-run --auto-servernum pnpm verify:sw-turn-recovery

      - name: Verify isolated service-worker Agent recovery
        if: matrix.shard == 1
        run: E2E_HEADFUL=1 xvfb-run --auto-servernum pnpm verify:sw-agent-recovery

      # Per-test timings, on every run and not only on failure. Without them
      # the only thing anyone can say about a slow gate is that it was slow —
      # which test retried, and which one is drifting, is not recoverable
      # afterwards from a job that only reported its own duration.
      - name: Upload test timings
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: e2e-timings-shard-${{ matrix.shard }}
          path: artifacts/e2e/results.json
          retention-days: 7
          if-no-files-found: ignore

      # Traces, videos, and the HTML report are only worth minutes and storage
      # when something failed.
      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: e2e-artifacts-shard-${{ matrix.shard }}
          path: artifacts/e2e
          retention-days: 7
          if-no-files-found: ignore

  agent-benchmark:
    name: Agent benchmark (shard ${{ matrix.shard }}/2)
    # Split out of the browser gates, which it shares nothing with but the
    # packaged build. Run in sequence there it added its whole ~198s to the
    # longest job in the run, for work that could have happened beside it.
    #
    # Not a threshold gate — it records what happened — but it still asserts,
    # and an ungated project is one nothing tells you about: the
    # completion-evidence rule broke two of its three scenarios and only a
    # manual run found out. Its conclusion still blocks a release through the
    # aggregate `Critical browser gates` job below.
    needs: [static-checks, build]
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.draft == false &&
       !contains(github.event.pull_request.labels.*.name, 'skip-e2e'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download the Chrome build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: chrome-build-prod
          path: build/chrome-mv3-prod

      - name: Resolve Playwright version
        id: playwright
        run: |
          echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Chromium
        # `--with-deps` is apt, which is most of this step even when the
        # browser cache hit and nothing is downloaded. The runner image
        # already ships Chromium's shared libraries, so only a cold cache
        # needs them. A launch failing on a missing shared object means this
        # branch was wrong: run `--with-deps` unconditionally again.
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome*.list \
            /etc/apt/sources.list.d/google*.list
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" = "true" ]; then
            pnpm exec playwright install chromium
          else
            pnpm exec playwright install --with-deps chromium
          fi

      - name: Record the agent benchmark on the fixture model
        run: pnpm e2e:chromium:agent-benchmark --shard=${{ matrix.shard }}/2

      # A shard's own attempts, and only those. Whether the pass is complete is
      # not a question this runner can answer, so it is asked once over every
      # partial in the aggregate job below.
      - name: Upload benchmark partial
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: agent-benchmark-partial-${{ matrix.shard }}
          path: artifacts/e2e/benchmark
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: agent-benchmark-artifacts-${{ matrix.shard }}
          path: artifacts/e2e
          retention-days: 7
          if-no-files-found: ignore

  browser-gates:
    # The stable name, kept deliberately. `release.yml` resolves a trusted CI
    # run by looking for a job called exactly this, and it used to be the one
    # job that ran every browser check. Sharding the suite and splitting the
    # benchmark out would have left that lookup matching nothing — a release
    # gate that silently stops gating — so the name survives as the aggregate
    # instead: it succeeds only when every shard and the benchmark did.
    #
    # It also merges the benchmark partials, which is where the suite's
    # completeness guard now lives. A worker could only ever check the attempts
    # it made itself; here a short pass, a doubled shard and a shard that never
    # ran at all are all visible, and all of them fail the job that gates a
    # release.
    name: Critical browser gates
    needs: [e2e, agent-benchmark]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download benchmark partials
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: agent-benchmark-partial-*
          path: artifacts/e2e/benchmark-partials

      - name: Merge the benchmark record
        run: pnpm benchmark:merge

      # The counts the benchmark writes are the record, and a record that only
      # exists on the runner that produced it cannot be read. Uploaded on
      # success too, for the same reason the persistence gates upload theirs.
      - name: Upload benchmark report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: agent-benchmark-report
          path: artifacts/e2e/benchmark
          retention-days: 30
          if-no-files-found: ignore

  provider-e2e-full:
    name: Provider stream matrix (scheduled)
    # Gated on `static-checks` rather than `checks` for the reason spelled
    # out on the browser gates above: the browser work waits on the verdict
    # that a branch compiles and lints, not on coverage being merged.
    needs: [static-checks, build-benchmark]
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download the benchmark build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: chrome-build-benchmark
          path: build/chrome-mv3-benchmark

      - name: Resolve Playwright version
        id: playwright
        run: |
          echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      # The runner image ships Google's Chrome apt source, and Playwright's
      # dependency install runs `apt-get update` across every source. That
      # mirror serves a stale index often enough to fail the whole gate for a
      # repository nothing here reads, so it is dropped first.
      - name: Install Chromium
        # `--with-deps` is apt, which is most of this step even when the
        # browser cache hit and nothing is downloaded. The runner image
        # already ships Chromium's shared libraries, so only a cold cache
        # needs them. A launch failing on a missing shared object means this
        # branch was wrong: run `--with-deps` unconditionally again.
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome*.list \
            /etc/apt/sources.list.d/google*.list
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" = "true" ]; then
            pnpm exec playwright install chromium
          else
            pnpm exec playwright install --with-deps chromium
          fi

      - name: Run full provider stream matrix
        run: pnpm e2e:chromium:provider-full

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: provider-e2e-artifacts
          path: artifacts/e2e
          retention-days: 7
          if-no-files-found: ignore
