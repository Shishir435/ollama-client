name: olc-searxng

services:
  core:
    container_name: olc-searxng-core
    image: docker.io/searxng/searxng:${SEARXNG_VERSION:-latest}
    restart: unless-stopped
    labels:
      io.ollama-client.olc.managed: "true"
      io.ollama-client.olc.service: searxng
      io.ollama-client.olc.component: server
      io.ollama-client.olc.version: ${OLC_VERSION:-unknown}
      io.ollama-client.olc.port: ${SEARXNG_HOST_PORT:-8080}
    ports:
      - "127.0.0.1:${SEARXNG_HOST_PORT:-8080}:8080"
    volumes:
      - ./core-config/:/etc/searxng/:rw
      - core-data:/var/cache/searxng/
    depends_on:
      - valkey

  valkey:
    container_name: olc-searxng-valkey
    image: docker.io/valkey/valkey:9-alpine
    command: valkey-server --save 30 1 --loglevel warning
    restart: unless-stopped
    labels:
      io.ollama-client.olc.managed: "true"
      io.ollama-client.olc.service: searxng
      io.ollama-client.olc.component: dependency
      io.ollama-client.olc.version: ${OLC_VERSION:-unknown}
    volumes:
      - valkey-data:/data/

volumes:
  core-data:
  valkey-data:
